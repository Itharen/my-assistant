<div class="app-shell" [class.side-panel-mode]="isSidePanelMode">
  <!-- FR #3f Phase 4.B (cycle 60): version-reload banner — server-bump után 5s countdown / dev-silent. -->
  <s-version-reload-banner></s-version-reload-banner>
  <header class="app-header">
    <h1>{{ title }}</h1>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/status" routerLinkActive="active">Status</a>
      <a routerLink="/reports" routerLinkActive="active">Reports</a>
      <!-- 🔗 KETTO belepo, mert a "/linkedin" NEM "LinkedIn altalaban", hanem az UZENETEK.
           Owner, 2026-09-11 10:55: "nem latom a LinkedIn posztokhoz, meg a LinkedIn
           profilhoz a feluleteket". A profil-panel LETEZETT (/linkedin/profile), de nem
           volt ra link — csak URL-begepelessel volt elerheto.
           EGY funkcio: ket link, nem menu-rendszer. -->
      <a
        routerLink="/linkedin"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">LinkedIn üzenetek</a>
      <a routerLink="/linkedin/profile" routerLinkActive="active">LinkedIn profil</a>
      <!-- ✍️ A POSZT-PANEL LINKJE — a handoff kikotese: "a profilnal ez kimaradt, ne
           ismeteljuk". Egy funkcio elerhetetlenul annyi, mint nem letezo. -->
      <a routerLink="/linkedin/posts" routerLinkActive="active">LinkedIn posztok</a>
      <a routerLink="/interfood" routerLinkActive="active">Interfood</a>
    </nav>
  </header>
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
  <!-- Global feedback system FAB (M3 generic shell + M4 feedback plugin registered in App_Module). -->
  <dynx-fab-shell></dynx-fab-shell>
  <!-- FR #3f Phase 4.A (cycle 59): status-bar footer (server + client version). -->
  @if (!isSidePanelMode) {
    <s-status-bar></s-status-bar>
  }
</div>

<!-- FR-059-B0 — a NÉMA-ÉRTESÍTÉS bug javítása.
     Az `A_Error_ControlService` doc-blokkja kimondja a szándékot: "Display a
     debug-level descriptive toast via `DyNX_Message_ControlService`" — és az
     `A_Error_Interceptor` + a globális `A_ErrorHandler_ControlService` is erre épül.
     A `<dynamo-notifications-area>` viszont SEHOL nem volt kirenderelve (még
     importálva sem az `app.module`-ban), tehát MINDEN hibaüzenet a semmibe ment.

     Az area SZÁNDÉKOSAN az `.app-shell` div-en KÍVÜL, a template VÉGÉN van.
     ⚠️ Ez az app még `ngx-dynamo@18.15.9`-en áll, amiben az area-nak MÉG NINCS
     overlay-pozicionálása (az `:host{position:fixed}` a 18.17.45-tel jön) — addig
     tehát flow-elemként viselkedik. A template végén ez ártalmatlan (üresen semmit
     nem foglal, értesítéskor a dokumentum aljára kerül), a lényeg viszont MOST
     megvan: a hibaüzenetek végre LÁTHATÓK. A valódi toast-viselkedés a dep-bumppal
     jön (18.15.9 → ≥18.17.45), ami külön, saját verifikációt igénylő lépés. -->
<dynamo-notifications-area></dynamo-notifications-area>
